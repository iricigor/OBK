name: 🚀 Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: numbered-windows-release
  queue: max

jobs:
  version:
    runs-on: windows-2025
    timeout-minutes: 5
    # GitHub only includes draft releases for callers with push access.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
      signing-enabled: ${{ steps.version.outputs.signing-enabled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Choose 1.0.<build ID> version or resume this commit's release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        shell: pwsh
        run: |
          if ($env:SIGNPATH_ENABLED -cnotin @('', 'false', 'true')) {
            throw 'SIGNPATH_ENABLED must be unset, false, or true.'
          }
          $signingEnabled = ($env:SIGNPATH_ENABLED -ceq 'true').ToString().ToLowerInvariant()
          "signing-enabled=$signingEnabled" >> $env:GITHUB_OUTPUT
          $pages = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --slurp | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list releases.' }
          $releases = @($pages | ForEach-Object { $_ } | Where-Object { $_.tag_name -match '^v(0\.1|1\.0)\.(0|[1-9][0-9]*)$' })
          $existing = @($releases | Where-Object { $_.target_commitish -eq $env:GITHUB_SHA })
          if ($existing.Count -gt 1) { throw 'Multiple releases point at this commit.' }
          if ($existing.Count -eq 1) {
            $version = $existing[0].tag_name.Substring(1)
            $published = (-not $existing[0].draft).ToString().ToLowerInvariant()
          } else {
            # 1.0.<run number>: the build ID of this Release workflow run, stable across re-runs.
            $version = "1.0.$env:GITHUB_RUN_NUMBER"
            if ($releases.tag_name -contains "v$version") { throw "Release v$version already exists for another commit." }
            $published = 'false'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "published=$published" >> $env:GITHUB_OUTPUT
  build:
    needs: version
    if: needs.version.outputs.published != 'true'
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign-release: ${{ needs.version.outputs.signing-enabled == 'true' }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  publish:
    needs: [version, build]
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: dist
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          SIGN_RELEASE: ${{ needs.version.outputs.signing-enabled }}
          SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        shell: pwsh
        run: |
          $installer = ".\dist\OBK-$env:APP_VERSION-windows-x64-setup.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "$hash  OBK-$env:APP_VERSION-windows-x64-setup.exe"
          if ((Get-Content -LiteralPath '.\dist\SHA256SUMS.txt' -Raw).Trim() -cne $expected) {
            throw 'Final installer checksum does not match SHA256SUMS.txt.'
          }
          if ($env:SIGN_RELEASE -eq 'true') {
            .\packaging\verify_signatures.ps1 -Files $installer -Version "$env:APP_VERSION" -CertificateThumbprint "$env:SIGNPATH_CERTIFICATE_THUMBPRINT"
          }
          $tag = "v$env:APP_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --generate-notes --title "OBK $tag"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create draft release.' }
          }
          gh release upload $tag ".\dist\OBK-$env:APP_VERSION-windows-x64-setup.exe" ".\dist\SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload release assets; release remains draft.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish release.' }
