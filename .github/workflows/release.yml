name: 🚀 Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: numbered-windows-release
  queue: max

jobs:
  version:
    runs-on: windows-2025
    timeout-minutes: 5
    # GitHub only includes draft releases for callers with push access.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
      signing-enabled: ${{ steps.version.outputs.signing-enabled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Choose 1.0.<build ID> version or resume this commit's release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        shell: pwsh
        run: |
          if ($env:SIGNPATH_ENABLED -cnotin @('', 'false', 'true')) {
            throw 'SIGNPATH_ENABLED must be unset, false, or true.'
          }
          $signingEnabled = ($env:SIGNPATH_ENABLED -ceq 'true').ToString().ToLowerInvariant()
          "signing-enabled=$signingEnabled" >> $env:GITHUB_OUTPUT
          $pages = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --slurp | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list releases.' }
          $releases = @($pages | ForEach-Object { $_ } | Where-Object { $_.tag_name -match '^v(0\.1|1\.0)\.(0|[1-9][0-9]*)$' })
          $existing = @($releases | Where-Object { $_.target_commitish -eq $env:GITHUB_SHA })
          if ($existing.Count -gt 1) { throw 'Multiple releases point at this commit.' }
          if ($existing.Count -eq 1) {
            $version = $existing[0].tag_name.Substring(1)
            $published = (-not $existing[0].draft).ToString().ToLowerInvariant()
          } else {
            # 1.0.<run number>: the build ID of this Release workflow run, stable across re-runs.
            $version = "1.0.$env:GITHUB_RUN_NUMBER"
            if ($releases.tag_name -contains "v$version") { throw "Release v$version already exists for another commit." }
            $published = 'false'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "published=$published" >> $env:GITHUB_OUTPUT
  build:
    needs: version
    if: needs.version.outputs.published != 'true'
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign-release: ${{ needs.version.outputs.signing-enabled == 'true' }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  android:
    needs: version
    if: needs.version.outputs.published != 'true'
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
  publish:
    needs: [version, build, android]
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release
          path: dist
      - name: Publish verified installer and APK
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          SIGN_RELEASE: ${{ needs.version.outputs.signing-enabled }}
          SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        shell: pwsh
        run: |
          .\packaging\publish_release.ps1 -Version $env:APP_VERSION -SignWindowsRelease:($env:SIGN_RELEASE -eq 'true')
