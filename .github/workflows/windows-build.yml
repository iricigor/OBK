name: 🔨 Windows build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  installer:
    name: Tests and installer smoke test
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Run mocked API, cache compatibility, and encryption tests
        run: dotnet test .\tests\OBK.Tests\OBK.Tests.csproj -c Release --nologo --verbosity minimal
      - name: Build installer with the runner's Inno Setup 6
        env:
          APP_VERSION: ${{ inputs.version }}
        run: .\packaging\build_installer.ps1 -Version "$env:APP_VERSION"
      - name: Verify installed app and uninstall
        env:
          APP_VERSION: ${{ inputs.version }}
        run: .\packaging\verify_installer.ps1 -Installer ".\dist\OBK-$env:APP_VERSION-windows-x64-setup.exe"
      - name: Write SHA-256 checksum
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          $file = Get-Item ".\dist\OBK-$env:APP_VERSION-windows-x64-setup.exe"
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content ".\dist\SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: |
            dist\OBK-*-windows-x64-setup.exe
            dist\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
