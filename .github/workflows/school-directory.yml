name: 📚 School directory refresh

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: school-directory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Prevent duplicate pending data updates
        run: |
          $pulls = gh pr list --state open --base main --limit 100 --json headRefName,url
          if ($LASTEXITCODE -ne 0) { throw "Could not check pending data updates." }
          $pending = @($pulls | ConvertFrom-Json | Where-Object {
            $_.headRefName.StartsWith('maintenance/school-directory-')
          })
          if ($pending.Count -gt 0) {
            throw "Review or close the pending directory PR before refreshing again: $($pending[0].url)"
          }
      - name: Run offline refresh tests
        run: |
          python -m unittest discover -s .\tools -p "test_school_directory.py"
          if ($LASTEXITCODE -ne 0) { throw "School directory tests failed." }
      - name: Collect available directory records
        run: |
          python .\tools\refresh_school_directory.py
          if ($LASTEXITCODE -ne 0) { throw "School directory refresh could not produce usable data; no update will be published." }
      - name: Propose changed compressed data
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          git add -- data/schools.json.gz
          if ($LASTEXITCODE -ne 0) { throw "Could not stage the snapshot." }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Directory unchanged; no commit or pull request."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw "Could not compare the snapshot." }
          $branch = "maintenance/school-directory-$env:RUN_ID-$env:RUN_ATTEMPT"
          git switch -c $branch
          if ($LASTEXITCODE -ne 0) { throw "Could not create the update branch." }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh compressed Bakalari school directory"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit the snapshot." }
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw "Could not push the update branch." }
          $summary = python -c "import gzip,json; d=json.load(gzip.open(r'data\schools.json.gz','rt',encoding='utf-8')); print('Collected', d['schoolCount'], 'of', d['expectedSchoolCount'], 'expected named-group schools. Diagnostics:', len(d['diagnostics']), '; malformed URLs:', d['invalidUrlCount'], '; excluded unnamed-group schools:', sum(x['schoolCount'] for x in d['excludedMunicipalities']))"
          if ($LASTEXITCODE -ne 0) { throw "Could not summarize the update." }
          $body = "$summary`n`nBest-effort refresh of data/schools.json.gz. Individual failures are recorded in metadata and logs. Municipality matches are lookup associations, not exact geographic assignments. Review diagnostics and lost coverage before merging. Gzip is not encryption. Application behavior is unchanged. Run Validation manually on this branch before merging: PRs created with GITHUB_TOKEN do not automatically trigger workflows."
          gh pr create --base main --head $branch `
            --title "Refresh compressed Bakalari school directory" `
            --body $body
          if ($LASTEXITCODE -ne 0) { throw "Could not open the data-update PR; inspect the pushed update branch." }
