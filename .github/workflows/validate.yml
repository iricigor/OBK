name: 🧪 Validation

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  school-directory:
    name: Offline school directory tests
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python -m unittest discover -s .\tools -p "test_school_directory.py"

  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      version: 0.1.0
