name: 🧪 Validation

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  school-directory:
    name: Offline school directory tests
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python -m unittest discover -s .\tools -p "test_school_directory.py"

  localization:
    name: Localization resource completeness
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test the completeness check
        run: python -m unittest discover -s .\tools -p "test_check_localization.py"
      - name: Check every language of each resource set
        run: python .\tools\check_localization.py

  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      version: 1.0.0
      fast-compression: true
