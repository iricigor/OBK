name: 🔨 Android release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64:
        required: true
      ANDROID_RELEASE_STORE_PASSWORD:
        required: true
      ANDROID_RELEASE_KEY_ALIAS:
        required: true
      ANDROID_RELEASE_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          OBK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          OBK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REF -ne 'refs/heads/main' -or $env:GITHUB_REPOSITORY -ne 'iricigor/OBK') {
            throw 'Production Android signing is restricted to pushes to iricigor/OBK main.'
          }
          foreach ($name in @('KEYSTORE_BASE64', 'OBK_ANDROID_KEYSTORE_PASSWORD', 'KEY_ALIAS', 'OBK_ANDROID_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing Android release signing secret: $name. Configure the secrets documented in docs/TECHNICAL.md."
            }
          }
          try { $bytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64) }
          catch { throw 'ANDROID_RELEASE_KEYSTORE_BASE64 is not valid base64.' }
          if ($bytes.Length -eq 0) { throw 'The Android release keystore is empty.' }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload and dependencies
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_HOME)) {
            $env:ANDROID_HOME = "$env:LOCALAPPDATA\Android\Sdk"
          }
          $env:JAVA_HOME = if ($env:JAVA_HOME_21_X64) { $env:JAVA_HOME_21_X64 } else { "$env:LOCALAPPDATA\Microsoft\jdk-21" }
          "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          "JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          dotnet workload install maui-android --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Android workload installation failed.' }
          dotnet build .\src\OBK.Android\OBK.Android.csproj -t:InstallAndroidDependencies `
            "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME" `
            -p:AcceptAndroidSdkLicenses=True --nologo --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK/JDK installation failed.' }
      - name: Build and verify persistently signed APK
        env:
          APP_VERSION: ${{ inputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          OBK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          OBK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "obk-release-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $directory | Out-Null
          try {
            $keystore = Join-Path $directory 'release.keystore'
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            .\packaging\build_android_release.ps1 -Version $env:APP_VERSION -KeystorePath $keystore -KeyAlias $env:KEY_ALIAS
          } finally {
            Remove-Item -LiteralPath $directory -Recurse -Force
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: |
            dist\OBK-${{ inputs.version }}-android.apk
            dist\ANDROID-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
